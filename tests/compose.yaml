# Host ports are fixed by default for manual use (`docker compose up`). Setting a
# `LS_*_PUBLISH` variable to an empty string lets Docker pick a free host port instead,
# which is what the integration tests do so they can run alongside a manual stack.
services:
  limesurvey:
    image: martialblog/limesurvey:${LS_IMAGE_TAG:-latest}
    volumes:
      - "surveys:/var/www/html/upload/surveys"
      - "apache:/var/log/apache2"
      - "./resources/config.php:/var/www/html/application/config/config.php"
    depends_on:
      - db
    ports:
      - "${LS_HTTP_PUBLISH-${LS_PORT:-8001}:}8080"
    environment:
      DB_TYPE: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: limesurvey
      DB_USERNAME: limesurvey
      DB_PASSWORD: secret
      ADMIN_USER: ${LS_USER:-iamadmin}
      ADMIN_NAME: Lime Administrator
      ADMIN_PASSWORD: ${LS_PASSWORD:-secret}
      EMAIL_SMTPHOST: ${LS_SMTP_HOST:-mailpit:1025}
      EMAIL_SMTPUSER: ${LS_SMTP_USER:-citric@example.com}
      EMAIL_SMTPPASSWORD: ${LS_SMTP_PASSWORD:-secret}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/index.php/admin"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 5s

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: limesurvey
      POSTGRES_DB: limesurvey
      POSTGRES_PASSWORD: secret
    ports:
      - "${LS_DB_PUBLISH-5433:}5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "limesurvey"]
      interval: 15s
      timeout: 10s
      retries: 3

  mailpit:
    image: axllent/mailpit:v1.30
    environment:
      MP_SMTP_AUTH: "citric@example.com:secret"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "${LS_SMTP_PUBLISH-1025:}1025"
      - "${LS_MAILPIT_PUBLISH-8025:}8025"

volumes:
  apache:
  limedb:
  surveys:
  object_storage:
