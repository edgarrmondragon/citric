version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.14"
  jobs:
    post_checkout:
      - git fetch --unshallow || true
    post_install:
      - uv pip install .

python:
  install:
    - method: uv
      command: pip
      requirements: requirements/docs.requirements.txt

sphinx:
  builder: html
  configuration: docs/conf.py
  fail_on_warning: true
