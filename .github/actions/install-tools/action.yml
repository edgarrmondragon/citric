name: Install tools
description: Install tools for Python projects

inputs:
  nox-version:
    description: "The version of Nox to install"
    required: true
  uv-version:
    description: "The version of uv to install"
    required: true
  uv-cache-suffix:
    description: "The unique cache suffix for setup-uv"
    required: true

runs:
  using: "composite"
  steps:
  - name: Install uv
    uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
    with:
      cache-suffix: ${{ inputs.uv-cache-suffix }}
      version: ${{ inputs.uv-version }}
