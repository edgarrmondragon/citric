name: Build

on:
  push:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI?"
        required: true
        default: false
        type: boolean
      tag:
        description: "Tag to use for release"
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build wheel and sdist
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.baipp.outputs.package_version }}
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        ref: ${{ github.event.inputs.tag || github.ref }}
        persist-credentials: false
    - uses: hynek/build-and-inspect-python-package@v3.0.2
      id: baipp

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.publish == 'true'
    runs-on: ubuntu-26.04
    needs: [build]
    environment:
      name: pypi
      url: https://pypi.org/project/citric/${{ needs.build.outputs.version }}
    permissions:
      id-token: write # IMPORTANT: mandatory for trusted publishing

    steps:
    - uses: actions/download-artifact@v8.0.2
      with:
        name: Packages
        path: dist
    - uses: pypa/gh-action-pypi-publish@v1.14.3

  sign:
    name: Sign the distribution package
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    needs: [build]
    permissions:
      contents: write     # IMPORTANT: mandatory for making GitHub Releases
      id-token: write     # IMPORTANT: mandatory for attestations
      attestations: write # IMPORTANT: mandatory for attestations

    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: Packages
          path: dist
      - uses: actions/attest@v4.2.2
        id: attest
        with:
          subject-path: "./dist/citric*"
