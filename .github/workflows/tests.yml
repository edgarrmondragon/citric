name: Tests

permissions: {}

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
    - examples/**
    - src/**
    - tests/**
    - compose*.yaml
    - noxfile.py
    - pyproject.toml
    - .github/default_tags.json
    - .github/include_tags.json
    - .github/tags.json
    - .github/workflows/tests.yml
    - .github/actions/install-tools/action.yml
  push:
    branches:
    - 'main'
    paths:
    - examples/**
    - src/**
    - tests/**
    - compose*.yaml
    - noxfile.py
    - pyproject.toml
    - .github/default_tags.json
    - .github/include_tags.json
    - .github/tags.json
    - .github/workflows/tests.yml
    - .github/actions/install-tools/action.yml
  schedule:
  - cron: "25 7 * * 1"
  workflow_dispatch:
    inputs:
      all_integrations:
        description: "Test against all the latest LimeSurvey docker image tags and all database engines"
        required: true
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"
  # renovate: datasource=pypi depName=nox
  NOX_VERSION: 2026.4.10
  # renovate: datasource=pypi depName=uv
  UV_VERSION: 0.11.24

jobs:
  tests:
    name: "Python ${{ join(matrix.python-version, ', ') }} / ${{ matrix.os }} (${{ matrix.session || 'unit' }})"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      COVERAGE_FILE: ".coverage.unit"
    strategy:
      fail-fast: false
      matrix:
        include:
        - python-version: ["3.10"]
          os: ubuntu-24.04
          session: lowest-requirements

        - python-version: ["3.10", "3.14"]
          os: ubuntu-24.04
          session: xdoctest

        - python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.14t"
          - "3.15"
          - "3.15t"
          os: ubuntu-24.04

        - python-version: ["3.16"]
          os: ubuntu-24.04

        - python-version: ["3.14"]
          os: windows-2025

        - python-version: ["3.14"]
          os: macos-26

    steps:
    - name: Check out the repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false

    - name: Setup Python
      if: ${{ matrix.python-version[0] != '3.16' }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ join(matrix.python-version, fromJson('"\n"')) }}
        architecture: x64
        allow-prereleases: true

    - name: Setup pre-release Python
      uses: deadsnakes/action@e640ac8743173a67cca4d7d77cd837e514bf98e8 # v3.2.0
      if: matrix.python-version[0] == '3.16'
      with:
        python-version: ${{ format('{0}-dev', matrix.python-version[0]) }}

    - name: Install tools
      uses: ./.github/actions/install-tools
      with:
        nox-version: ${{ env.NOX_VERSION }}
        uv-version: ${{ env.UV_VERSION }}
        uv-cache-suffix: ${{ matrix.session || 'unit' }}

    - name: Run Tests
      env:
        NOX_DOWNLOAD_PYTHON: never
        NOXFORCEPYTHON: ${{ join(matrix.python-version, ',') }}
        NOXSESSION: ${{ matrix.session || 'test' }}
      run: |
        nox --verbose -- --junit-xml=tests.xml

    - name: Upload coverage data
      if: ${{ matrix.session != 'xdoctest' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        include-hidden-files: true
        name: "coverage-unit-${{ matrix.os }}-${{ join(matrix.python-version, '-') }}"
        path: ".coverage.*"

    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: tests.xml
        flags: unit-${{ matrix.os }}-${{ join(matrix.python-version, '-') }}
        report_type: test_results

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
    - name: Check out the repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false

    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: 3.x

    - name: Install tools
      uses: ./.github/actions/install-tools
      with:
        nox-version: ${{ env.NOX_VERSION }}
        uv-version: ${{ env.UV_VERSION }}
        uv-cache-suffix: lint

    - uses: j178/prek-action@e98a699c41eb69ab013a45817a0406469a748f8d # v2.0.5
    - run: nox -t lint

  docker_tags:
    name: Get Docker tags
    runs-on: ubuntu-24.04
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
      includes: ${{ steps.tags.outputs.includes }}
    permissions:
      contents: read
    steps:
    - name: Check out the repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false

    - name: Output tags
      id: tags
      env:
        ALL_INTEGRATIONS: ${{ inputs.all_integrations }}
      run: |
        if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$ALL_INTEGRATIONS" == "true" || "$GITHUB_HEAD_REF" == release/* ]]; then
          echo "tags=$(jq -c . < .github/tags.json)" >> "$GITHUB_OUTPUT"
          echo "includes=$(jq -c '[.[] | del(.schedule_only)]' < .github/include_tags.json)" >> "$GITHUB_OUTPUT"
        else
          echo "tags=$(jq -c . < .github/default_tags.json)" >> "$GITHUB_OUTPUT"
          echo "includes=$(jq -c '[.[] | select(.schedule_only == false) | del(.schedule_only)]' < .github/include_tags.json)" >> "$GITHUB_OUTPUT"
        fi

  integration:
    name: "Python ${{ matrix.python-version }} / ${{ matrix.image_tag || matrix.ref }} / ${{ matrix.database }}"
    runs-on: ubuntu-24.04
    continue-on-error: true
    needs: [docker_tags]
    permissions:
      contents: read
    env:
      COVERAGE_FILE: ".coverage.integration"
      LS_IMAGE_TAG: ${{ matrix.image_tag }}
      LS_REF: ${{ matrix.ref }}
      LS_USER: citric_ci
      LS_PASSWORD: notverysecret
      NOXSESSION: integration
      NOXFORCEPYTHON: "${{ matrix.python-version }}"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
        database: ["postgres"]
        ref: [""]
        context: [""]
        image_tag: ${{ fromJson(needs.docker_tags.outputs.tags) }}
        include: ${{ fromJson(needs.docker_tags.outputs.includes) }}

    steps:
    - name: Check out the repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false

    - name: Setup Python ${{ matrix.python-version }}
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: ${{ matrix.python-version }}
        architecture: x64
        allow-prereleases: true

    - if: always()
      env:
        REF: ${{ matrix.ref }}
      run: |
        echo "CLEAN_REF=$(echo "$REF" | tr / -)" >> "$GITHUB_ENV"

    - name: Install tools
      uses: ./.github/actions/install-tools
      with:
        nox-version: ${{ env.NOX_VERSION }}
        uv-version: ${{ env.UV_VERSION }}
        uv-cache-suffix: integration-${{ matrix.python-version }}-${{ matrix.image_tag || env.CLEAN_REF }}-${{ matrix.database }}

    - name: Run Nox
      id: nox-integration
      env:
        LS_DATABASE_TYPE: ${{ matrix.database }}
        LS_DOCKER_CONTEXT: ${{ matrix.context }}
        LS_DOCKERFILE: Dockerfile
      run: |
        nox -- --junit-xml=integration.xml

    - name: Upload test results to Codecov
      if: ${{ !cancelled() }}
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: integration.xml
        flags: integration-${{ matrix.python-version }}-${{ matrix.image_tag || matrix.ref }}-${{ matrix.database }}
        report_type: test_results

    - name: Upload coverage data
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        include-hidden-files: true
        name: "coverage-integration-${{ matrix.python-version }}-${{ matrix.image_tag || env.CLEAN_REF }}-${{ matrix.database }}"
        path: ".coverage.*"

  coverage:
    name: Coverage
    runs-on: ubuntu-24.04
    needs: [tests, integration]
    permissions:
      contents: read
    env:
      NOXSESSION: coverage
    strategy:
      matrix:
        flag: ["unit", "integration"]
      fail-fast: false
    steps:
    - name: Check out the repository
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: "3.x"

    - name: Install tools
      uses: ./.github/actions/install-tools
      with:
        nox-version: ${{ env.NOX_VERSION }}
        uv-version: ${{ env.UV_VERSION }}
        uv-cache-suffix: coverage-${{ matrix.flag }}

    - name: Download coverage data
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: "coverage-${{ matrix.flag }}-*"
        merge-multiple: true

    - name: Combine coverage data and display human readable report
      continue-on-error: true
      run: |
        nox

    - name: Create coverage report
      run: |
        nox -- xml

    - name: Upload coverage report
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        fail_ci_if_error: true
        flags: ${{ matrix.flag }}
